services:
  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: 172.17.0.1
      DB_PORT: 3306
      DB_DATABASE: it_ticketing
      DB_USERNAME: smct
      DB_PASSWORD: smct
      REDIS_HOST: redis
      RUN_MIGRATIONS: 'true'
    depends_on:
      redis:
        condition: service_started
    volumes:
      - app_storage:/var/www/html/storage
      - public_assets:/var/www/html/public

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: 172.17.0.1
      DB_PORT: 3306
      DB_DATABASE: it_ticketing
      DB_USERNAME: smct
      DB_PASSWORD: smct
      REDIS_HOST: redis
      RUN_MIGRATIONS: 'false'
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - app_storage:/var/www/html/storage
      - public_assets:/var/www/html/public

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${APP_PORT:-9110}:80'
    depends_on:
      - app
    volumes:
      - public_assets:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  app_storage:
  public_assets:
  mysql_data:
  redis_data:
